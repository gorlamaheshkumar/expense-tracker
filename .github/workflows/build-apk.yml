name: Build Android APK

# Builds the debug APK on GitHub's Linux runners (Buildozer can't run on
# Windows, and this also sidesteps any corporate network / CDN blocks since all
# Android SDK/NDK downloads happen on GitHub's servers).
#
# We install Buildozer directly (no third-party Docker action) for reliability.
# Pinned to ubuntu-22.04 on purpose: 24.04 removed libtinfo5, which Android's
# aapt needs, and to Cython <3 which python-for-android recipes require.
#
# Trigger: every push to main/master, or manually from the Actions tab
# ("Run workflow"). Download the .apk from the run's Artifacts when it finishes.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        # Android Gradle Plugin requires Java 17. apt-installing the JDK isn't
        # enough — the runner's *active* JDK defaults to 11, so use setup-java
        # to make 17 the active JAVA_HOME/PATH for the whole job.
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          # Pass 1: let Buildozer download the SDK/NDK. It bails when the
          # SDK license prompt defaults to "no" (that's the "Aidl not found"
          # failure), so don't let that stop the job.
          buildozer android debug || true

          # Accept the Android SDK licenses by writing the known acceptance
          # hashes, so sdkmanager will actually install platform-tools +
          # build-tools (which provide aidl) on the next pass.
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK/licenses/android-sdk-preview-license"

          # Pass 2: real build, now that build-tools/aidl can install.
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expensetracker-debug-apk
          path: bin/*.apk
          if-no-files-found: error
